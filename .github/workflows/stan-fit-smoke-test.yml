name: Stan fit smoke test

"on":
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CMDSTAN_VERSION: "2.36.0"
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache CmdStan
        id: cache-cmdstan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: ${{ runner.os }}-cmdstan-${{ env.CMDSTAN_VERSION }}

      - name: Install CmdStan if missing
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          import cmdstanpy

          cmdstanpy.install_cmdstan(
              version=os.environ["CMDSTAN_VERSION"],
              cores=2,
              progress=True,
          )
          PY

      - name: Check CmdStan
        run: python -c "import cmdstanpy; print(cmdstanpy.cmdstan_path())"

      - name: Run real-pipeline smoke test
        run: python scripts/smoke_test_stan_fit.py

      - name: Upload smoke-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stan-fit-smoke-test
          path: |
            Stan_outputs/**/*.csv
            Stan_outputs/**/*.stan
            Stan_outputs/**/*-stdout.txt
          if-no-files-found: warn

